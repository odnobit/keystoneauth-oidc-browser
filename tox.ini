[tox]
minversion = 4.6.0
envlist = py3,pep8

[testenv]
description = Run unit tests.
usedevelop = true
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/test-requirements.txt
setenv =
    PYTHONDONTWRITEBYTECODE=1
commands =
    pytest {posargs}

[testenv:pep8]
description = Run style checks (pre-commit: ruff, codespell, ...) and type checks.
deps =
    pre-commit
    {[testenv:mypy]deps}
commands =
    pre-commit run --all-files --show-diff-on-failure
    {[testenv:mypy]commands}

[testenv:cover]
description = Run unit tests with coverage.
commands =
    pytest --cov=keystoneauth_oidc_browser --cov-report=term-missing \
        --cov-report=html:cover --cov-report=xml:cover/coverage.xml {posargs}

[testenv:mypy]
description = Run type checks.
deps =
    {[testenv]deps}
    mypy
commands =
    mypy --cache-dir="{envdir}/mypy_cache" {posargs:keystoneauth_oidc_browser}

[testenv:venv]
description = Run an arbitrary command in the test environment.
commands =
    {posargs}

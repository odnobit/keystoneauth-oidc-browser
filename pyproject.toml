[project]
name = "keystoneauth-oidc-browser"
description = "keystoneauth1 OpenID Connect browser login (Authorization Code, PKCE) with Keystone token caching; auth type v3oidcbrowser"
authors = [
    {name = "Vladimir Lobanov", email = "odnobit@yandex.ru"}
]
license = "MIT"
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = ["version", "dependencies"]
requires-python = ">=3.9"
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
"Source" = "https://github.com/odnobit/keystoneauth-oidc-browser"
"Bugs" = "https://github.com/odnobit/keystoneauth-oidc-browser/issues"

[project.entry-points."keystoneauth1.plugin"]
v3oidcbrowser = "keystoneauth_oidc_browser.loading:OidcAuthorizationCodeCachedLoader"

[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[tool.setuptools.packages.find]
include = ["keystoneauth_oidc_browser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "G", "LOG", "S"]
# printf-style formatting is the OpenStack idiom and is used throughout.
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# The callback page's inline CSS is kept one rule per line.
"keystoneauth_oidc_browser/browser.py" = ["E501"]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
files = ["keystoneauth_oidc_browser"]
